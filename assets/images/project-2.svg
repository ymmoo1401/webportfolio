<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#0052D4" />
    </linearGradient>
    <linearGradient id="p2Accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="p2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p2Bg)" />

  <!-- Wireframe Grid Background lines -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="450" y1="0" x2="450" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- UI Window Mockup (Glassmorphism Browser Card) -->
  <g transform="translate(60, 60)" filter="url(#p2Shadow)">
    <rect width="480" height="280" rx="16" fill="rgba(30, 41, 59, 0.75)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect width="480" height="38" rx="16" fill="rgba(15, 23, 42, 0.9)" />
    <!-- Traffic lights dots -->
    <circle cx="24" cy="19" r="5" fill="#EF4444" />
    <circle cx="42" cy="19" r="5" fill="#FFDD00" />
    <circle cx="60" cy="19" r="5" fill="#10B981" />
    <!-- Address Bar -->
    <rect x="90" y="8" width="280" height="22" rx="11" fill="rgba(255,255,255,0.08)" />
    <text x="110" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94A3B8">aurora-design-system.dev/preview</text>

    <!-- UI Components Inside -->
    <!-- Left Sidebar -->
    <rect x="15" y="50" width="80" height="215" rx="8" fill="rgba(255,255,255,0.04)" />
    <rect x="25" y="65" width="60" height="8" rx="4" fill="#00D2FF" />
    <rect x="25" y="85" width="50" height="6" rx="3" fill="#64748B" />
    <rect x="25" y="100" width="45" height="6" rx="3" fill="#64748B" />
    <rect x="25" y="115" width="55" height="6" rx="3" fill="#64748B" />

    <!-- Main Content Area -->
    <rect x="110" y="55" width="160" height="18" rx="4" fill="url(#p2Accent)" />
    <rect x="110" y="82" width="220" height="8" rx="4" fill="#94A3B8" />
    <rect x="110" y="96" width="180" height="8" rx="4" fill="#64748B" />

    <!-- Interactive Cards inside window -->
    <g transform="translate(110, 120)">
      <rect width="165" height="130" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="#00D2FF" stroke-width="1.5" />
      <circle cx="30" cy="30" r="16" fill="#0066FF" />
      <rect x="55" y="22" width="90" height="8" rx="4" fill="#FFFFFF" />
      <rect x="55" y="34" width="60" height="6" rx="3" fill="#94A3B8" />
      <rect x="15" y="60" width="135" height="50" rx="8" fill="rgba(0, 210, 255, 0.1)" />
      <!-- Toggle button -->
      <rect x="15" y="85" width="60" height="18" rx="9" fill="#FFDD00" />
      <circle cx="65" cy="94" r="7" fill="#0F172A" />
    </g>

    <!-- Mobile Screen floating overlay -->
    <g transform="translate(300, 75)" filter="url(#p2Shadow)">
      <rect width="145" height="185" rx="18" fill="#0F172A" stroke="#FFDD00" stroke-width="2" />
      <rect x="45" y="8" width="55" height="6" rx="3" fill="#334155" />
      <!-- Mobile Hero -->
      <rect x="15" y="25" width="115" height="65" rx="10" fill="url(#p2Accent)" opacity="0.8" />
      <rect x="15" y="100" width="70" height="10" rx="4" fill="#FFFFFF" />
      <rect x="15" y="118" width="115" height="6" rx="3" fill="#64748B" />
      <rect x="15" y="130" width="90" height="6" rx="3" fill="#64748B" />
      <rect x="15" y="148" width="115" height="22" rx="6" fill="#0066FF" />
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 25)">
    <rect width="150" height="32" rx="16" fill="rgba(0, 210, 255, 0.15)" stroke="#00D2FF" stroke-width="1.5" />
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#00D2FF" text-anchor="middle">UI/UX &amp; WEB</text>
  </g>
</svg>
