<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="p1Grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#FFDD00" />
    </linearGradient>
    <filter id="p1Glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#p1Bg)" />

  <!-- Animated-like waveform / Motion lines -->
  <path d="M0 240 Q 150 120 300 240 T 600 240" fill="none" stroke="#00D2FF" stroke-width="4" opacity="0.6" />
  <path d="M0 260 Q 150 360 300 260 T 600 260" fill="none" stroke="#FFDD00" stroke-width="3" opacity="0.5" />
  <path d="M0 200 Q 150 300 300 200 T 600 200" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.4" />

  <!-- Abstract Motion Graphic Shapes -->
  <g transform="translate(180, 70)" filter="url(#p1Glow)">
    <!-- Rotating geometric polygon composition -->
    <polygon points="120,20 220,90 200,200 80,220 20,130" fill="rgba(0, 102, 255, 0.25)" stroke="url(#p1Grad1)" stroke-width="3" />
    <circle cx="120" cy="120" r="70" fill="none" stroke="#FFDD00" stroke-width="2" stroke-dasharray="10 5" />
    <circle cx="120" cy="120" r="45" fill="rgba(15, 23, 42, 0.8)" stroke="#00D2FF" stroke-width="3" />
    <!-- Play Triangle in Center -->
    <polygon points="112,105 136,120 112,135" fill="#FFDD00" />
  </g>

  <!-- Sound/Motion Equalizer Bars -->
  <g transform="translate(60, 310)">
    <rect x="0" y="20" width="8" height="30" rx="4" fill="#00D2FF" />
    <rect x="16" y="5" width="8" height="45" rx="4" fill="#38BDF8" />
    <rect x="32" y="15" width="8" height="35" rx="4" fill="#FFDD00" />
    <rect x="48" y="0" width="8" height="50" rx="4" fill="#FFB800" />
    <rect x="64" y="25" width="8" height="25" rx="4" fill="#00D2FF" />
    <rect x="80" y="10" width="8" height="40" rx="4" fill="#38BDF8" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 30)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 221, 0, 0.15)" stroke="#FFDD00" stroke-width="1.5" />
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFDD00" text-anchor="middle">MOTION GRAPHIC</text>
  </g>

  <!-- Lower Title Banner -->
  <rect x="40" y="325" width="300" height="30" rx="6" fill="rgba(15, 23, 42, 0.7)" />
  <text x="50" y="345" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">CyberPulse Identity &amp; Title Sequence</text>
</svg>
