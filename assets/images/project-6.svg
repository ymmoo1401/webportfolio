<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p6Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <filter id="aiGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#p6Bg)" />

  <!-- Neural Network Synapse Lines -->
  <g stroke="url(#neuralGrad)" stroke-width="1.8" opacity="0.6">
    <line x1="80" y1="120" x2="180" y2="180" />
    <line x1="80" y1="200" x2="180" y2="180" />
    <line x1="80" y1="280" x2="180" y2="240" />
    
    <line x1="180" y1="180" x2="300" y2="140" />
    <line x1="180" y1="180" x2="300" y2="210" />
    <line x1="180" y1="240" x2="300" y2="210" />
    <line x1="180" y1="240" x2="300" y2="280" />

    <line x1="300" y1="140" x2="420" y2="170" />
    <line x1="300" y1="210" x2="420" y2="170" />
    <line x1="300" y1="210" x2="420" y2="250" />
    <line x1="300" y1="280" x2="420" y2="250" />

    <line x1="420" y1="170" x2="520" y2="200" />
    <line x1="420" y1="250" x2="520" y2="200" />
  </g>

  <!-- Neural Nodes with Pulse -->
  <!-- Layer 1 -->
  <circle cx="80" cy="120" r="8" fill="#FFDD00" filter="url(#aiGlow)" />
  <circle cx="80" cy="200" r="10" fill="#00D2FF" filter="url(#aiGlow)" />
  <circle cx="80" cy="280" r="8" fill="#FFDD00" filter="url(#aiGlow)" />

  <!-- Layer 2 -->
  <circle cx="180" cy="180" r="14" fill="#0066FF" stroke="#00D2FF" stroke-width="3" />
  <circle cx="180" cy="240" r="12" fill="#FBBF24" stroke="#FFDD00" stroke-width="2.5" />

  <!-- Center Brain / AI Core (Layer 3) -->
  <g transform="translate(300, 205)" filter="url(#aiGlow)">
    <circle cx="0" cy="0" r="45" fill="rgba(15, 23, 42, 0.9)" stroke="url(#neuralGrad)" stroke-width="3" />
    <!-- AI Sparkle Icon -->
    <path d="M0 -22 L5 -7 L20 0 L5 7 L0 22 L-5 7 L-20 0 L-5 -7 Z" fill="#FFDD00" />
    <circle cx="-16" cy="-16" r="3" fill="#00D2FF" />
    <circle cx="16" cy="16" r="3" fill="#00D2FF" />
  </g>

  <!-- Layer 4 -->
  <circle cx="420" cy="170" r="12" fill="#00D2FF" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="420" cy="250" r="14" fill="#FFB800" stroke="#FFFFFF" stroke-width="2" />

  <!-- Output Node -->
  <circle cx="520" cy="200" r="18" fill="url(#neuralGrad)" filter="url(#aiGlow)" />
  <text x="520" y="205" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">AI</text>

  <!-- Tag Pill -->
  <g transform="translate(420, 25)">
    <rect width="150" height="32" rx="16" fill="rgba(255, 221, 0, 0.15)" stroke="#FFDD00" stroke-width="1.5" />
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFDD00" text-anchor="middle">AI &amp; INTERACTIVE</text>
  </g>

  <!-- Prompt input bar simulated -->
  <g transform="translate(60, 335)">
    <rect width="480" height="36" rx="18" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(255,255,255,0.15)" />
    <!-- Terminal prompt symbol -->
    <text x="20" y="23" font-family="'Plus Jakarta Sans', monospace" font-size="13" fill="#00D2FF" font-weight="700">&gt;_</text>
    <text x="45" y="23" font-family="'Plus Jakarta Sans', monospace" font-size="12" fill="#E2E8F0">generate interactive media --style synthwave --v 6.0</text>
    <rect x="430" y="6" width="38" height="24" rx="12" fill="#FFDD00" />
    <polygon points="446,14 456,18 446,22" fill="#0F172A" />
  </g>
</svg>
