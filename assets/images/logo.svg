<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="blueYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="60%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF7700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Symbol -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="44" height="44" rx="14" fill="#0f172a" stroke="url(#blueYellowGrad)" stroke-width="2.5" />
    <path d="M14 30 L22 14 L30 30" fill="none" stroke="url(#blueYellowGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="14" r="3.5" fill="#FFB800" filter="url(#glow)" />
    <circle cx="14" cy="30" r="2.5" fill="#00D2FF" />
    <circle cx="30" cy="30" r="2.5" fill="#0066FF" />
    <path d="M18 25 L26 25" stroke="#FFB800" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="21" font-weight="800" fill="#0f172a" class="brand-text">CREATIVE</text>
  <text x="166" y="32" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="21" font-weight="800" fill="#FFB800">.</text>
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" fill="#0066FF">MEDIA PORTFOLIO</text>
</svg>
