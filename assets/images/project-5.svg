<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="p5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="lensReflect" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00D2FF" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#FFDD00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="bokeh1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD00" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFDD00" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#p5Bg)" />

  <!-- Bokeh circles background -->
  <circle cx="80" cy="120" r="70" fill="url(#bokeh1)" />
  <circle cx="480" cy="100" r="85" fill="url(#bokeh2)" />
  <circle cx="520" cy="280" r="110" fill="url(#bokeh1)" />
  <circle cx="140" cy="300" r="90" fill="url(#bokeh2)" />
  <circle cx="320" cy="60" r="45" fill="url(#bokeh1)" />

  <!-- Camera Aperture & Lens Illustration in Center -->
  <g transform="translate(300, 200)">
    <!-- Outer Lens Ring with knurled grip pattern -->
    <circle cx="0" cy="0" r="130" fill="#0A0E17" stroke="#334155" stroke-width="6" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#FFDD00" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="112" fill="#1E293B" stroke="#00D2FF" stroke-width="1.5" />

    <!-- Text on Lens Rim -->
    <text x="0" y="-95" font-family="'Plus Jakarta Sans', monospace" font-size="9" fill="#94A3B8" text-anchor="middle" letter-spacing="2">F/1.4  50MM  NANO COATING</text>
    
    <!-- Glass Elements Reflection -->
    <circle cx="0" cy="0" r="90" fill="url(#lensReflect)" />
    
    <!-- Aperture Blades (8-bladed iris) -->
    <g fill="#0F172A" stroke="#FFDD00" stroke-width="1" opacity="0.95">
      <polygon points="0,-40 35,-20 15,10 -20,-10" />
      <polygon points="35,-20 40,15 10,25 -5,-10" />
      <polygon points="40,15 15,40 -15,25 10,-5" />
      <polygon points="15,40 -20,35 -25,10 5,0" />
      <polygon points="-20,35 -40,0 -15,-20 0,10" />
      <polygon points="-40,0 -25,-35 0,-15 -10,15" />
      <polygon points="-25,-35 10,-40 25,-15 -5,-5" />
    </g>

    <!-- Center Light Point / Pupil -->
    <circle cx="0" cy="0" r="16" fill="#00D2FF" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />

    <!-- Lens Flare Streak -->
    <ellipse cx="20" cy="-20" rx="60" ry="12" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 20 -20)" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(420, 25)">
    <rect width="150" height="32" rx="16" fill="rgba(0, 210, 255, 0.15)" stroke="#00D2FF" stroke-width="1.5" />
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#00D2FF" text-anchor="middle">PHOTOGRAPHY</text>
  </g>

  <!-- Spec details bottom -->
  <g transform="translate(40, 345)">
    <text font-family="'Plus Jakarta Sans', monospace" font-size="12" fill="#FFDD00" font-weight="600">ISO 100 • 1/250s • f/1.4 • RAW</text>
  </g>
</svg>
