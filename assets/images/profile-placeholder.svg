<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="100%" stop-color="#FBB034" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B58D" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002b80" flood-opacity="0.35"/>
    </filter>
    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle with Border Ring -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGrad)" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#yellowAccent)" stroke-width="4" stroke-dasharray="8 6" opacity="0.85" />

  <!-- Floating Creative Design Elements in Background -->
  <!-- Crosses & Dots -->
  <path d="M70 120 L90 120 M80 110 L80 130" stroke="#FFDD00" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <path d="M410 160 L430 160 M420 150 L420 170" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <circle cx="100" cy="380" r="8" fill="#FFDD00" opacity="0.7" />
  <circle cx="410" cy="360" r="12" fill="#00D2FF" opacity="0.8" />
  
  <!-- Pen Tool Anchor Point Symbol (Creative Media) -->
  <g transform="translate(370, 90)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#FFDD00" />
    <path d="M12 24 L24 12 M20 12 L24 12 L24 16" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Camera / Play Symbol -->
  <g transform="translate(60, 240)">
    <circle cx="20" cy="20" r="22" fill="#0F172A" stroke="#FFDD00" stroke-width="2" />
    <polygon points="16,12 28,20 16,28" fill="#FFDD00" />
  </g>

  <!-- Character Illustration Body -->
  <!-- Jacket / Shoulders -->
  <path d="M120 480 C120 390 160 360 250 360 C340 360 380 390 380 480 Z" fill="url(#jacketGrad)" />
  
  <!-- Inner Shirt (Cyan with Yellow zipper detail) -->
  <path d="M210 360 L250 430 L290 360 Z" fill="#00D2FF" />
  <path d="M250 380 L250 480" stroke="#FFDD00" stroke-width="3" stroke-linecap="round" />

  <!-- Jacket Collar -->
  <path d="M185 365 L225 435 L210 445 L170 375 Z" fill="#334155" />
  <path d="M315 365 L275 435 L290 445 L330 375 Z" fill="#1E293B" />

  <!-- Neck -->
  <rect x="220" y="300" width="60" height="75" rx="10" fill="url(#skinGrad)" />
  <path d="M220 340 C240 360 260 360 280 340 L280 360 L220 360 Z" fill="#D99B77" opacity="0.3" />

  <!-- Head Base -->
  <ellipse cx="250" cy="230" rx="75" ry="92" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="174" cy="235" r="16" fill="url(#skinGrad)" />
  <circle cx="326" cy="235" r="16" fill="url(#skinGrad)" />

  <!-- Hair Base & Details -->
  <path d="M175 220 C165 140 210 110 250 110 C310 110 335 150 325 220 C310 180 290 160 250 160 C205 160 185 190 175 220 Z" fill="url(#hairGrad)" />
  <path d="M175 190 C190 140 240 125 290 135 C270 145 220 140 195 185 Z" fill="#3B4252" />

  <!-- Modern Designer Eyeglasses (Yellow Accent Frames) -->
  <!-- Left Lens -->
  <rect x="190" y="205" width="46" height="38" rx="10" fill="rgba(255,255,255,0.2)" stroke="#FFDD00" stroke-width="4.5" />
  <!-- Right Lens -->
  <rect x="264" y="205" width="46" height="38" rx="10" fill="rgba(255,255,255,0.2)" stroke="#FFDD00" stroke-width="4.5" />
  <!-- Bridge -->
  <path d="M236 220 L264 220" stroke="#FFDD00" stroke-width="4.5" stroke-linecap="round" />
  <!-- Glasses Temple -->
  <path d="M190 220 L172 215" stroke="#FFDD00" stroke-width="4" stroke-linecap="round" />
  <path d="M310 220 L328 215" stroke="#FFDD00" stroke-width="4" stroke-linecap="round" />

  <!-- Eyes behind glass -->
  <ellipse cx="213" cy="224" rx="7" ry="7" fill="#0F172A" />
  <circle cx="215" cy="222" r="2.5" fill="#FFFFFF" />
  <ellipse cx="287" cy="224" rx="7" ry="7" fill="#0F172A" />
  <circle cx="289" cy="222" r="2.5" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M192 195 C205 190 225 192 235 198" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M265 198 C275 192 295 190 308 195" stroke="#1E293B" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Nose & Smile -->
  <path d="M250 226 L246 250 L254 250" stroke="#D99B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M234 275 C244 287 256 287 266 275" stroke="#BF6A49" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Creative Media Headphone Over Neck / Head -->
  <path d="M158 200 C155 240 162 270 178 285" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M342 200 C345 240 338 270 322 285" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none" />
  <rect x="156" y="220" width="22" height="42" rx="10" fill="#0F172A" stroke="#FFDD00" stroke-width="2.5" />
  <rect x="322" y="220" width="22" height="42" rx="10" fill="#0F172A" stroke="#FFDD00" stroke-width="2.5" />

  <!-- Foreground Glassmorphism Badge "CREATIVE MEDIA" -->
  <g transform="translate(130, 430)">
    <rect x="0" y="0" width="240" height="46" rx="23" fill="rgba(15, 23, 42, 0.88)" stroke="url(#yellowAccent)" stroke-width="2" filter="url(#softShadow)" />
    <!-- Pulse icon dot -->
    <circle cx="28" cy="23" r="6" fill="#00D2FF" />
    <circle cx="28" cy="23" r="10" fill="none" stroke="#00D2FF" stroke-width="2" opacity="0.6" />
    <text x="50" y="28" font-family="'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">CREATIVE DESIGNER</text>
  </g>
</svg>
